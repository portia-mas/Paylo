    if(d>0&&r()<0.14)continue;
    const n=6+Math.floor(r()*7);
    for(let i=0;i<n;i++){
      const it=S.items[Math.floor(r()*S.items.length)];
      const qty=1+Math.floor(r()*3);
      const m=r();const method=m<.82?'cash':(m<.94?'qr':'link');
      const ts=day.getTime()+(8+Math.floor(r()*10))*36e5+Math.floor(r()*36e5);
      if(ts>Date.now())continue;
      out.push(mk('sale',it.p*qty,method,qty+'× '+it.n,ts));
    }
    if(d%2===0){const ts=day.getTime()+7*36e5;if(ts<Date.now())out.push(mk('expense',400+Math.floor(r()*300),'cash',['Stock','Gas','Transport'][Math.floor(r()*3)],ts));}
  }
  for(const e of out)e.sig=await sign(canon(e));
  return out;
}

/* ---------- metrics & score ---------- */
function metrics(){
  const now=Date.now(),from=now-30*864e5;
  const L=S.ledger.filter(e=>e.ts>=from);
  const sales=L.filter(e=>e.type==='sale'),exp=L.filter(e=>e.type==='expense');
  const rev=sum(sales),cost=sum(exp),profit=rev-cost;
  const days=new Set(sales.filter(e=>e.amount>0).map(e=>dayKey(e.ts))).size;
  const dig=sum(sales.filter(e=>e.method!=='cash'));
  const digShare=rev>0?dig/rev:0,margin=rev>0?profit/rev:0;
  const first=S.ledger.length?Math.min(...S.ledger.map(e=>e.ts)):now;
  const history=Math.max(0,Math.round((now-first)/864e5)+1);
  const parts={Consistency:Math.min(30,days/28*30),Volume:Math.min(25,Math.max(0,rev)/20000*25),'Digital share':Math.min(20,digShare/0.5*20),Margin:Math.min(15,Math.max(0,margin)/0.4*15),History:Math.min(10,history/30*10)};
  const score=Math.round(Object.values(parts).reduce((a,b)=>a+b,0));
  const tier=score>=85?'Strong':score>=70?'Ready':score>=40?'Building':'Starting';
  return {rev,cost,profit,days,dig,digShare,margin,history,parts,score,tier};
}
function bandR(x){const lo=Math.floor(Math.max(0,x)/2500)*2500;return 'R'+lo.toLocaleString('en-ZA').replace(/\u00a0/g,' ')+'–R'+(lo+2500).toLocaleString('en-ZA').replace(/\u00a0/g,' ');}
function readiness(m){

   {ok:m.history>=28,t:'28+ days of records',d:m.history+' days so far'},
   {ok:m.days>=20,t:'Traded on 20+ of the last 30 days',d:m.days+' days'},
   {ok:m.digShare>=0.25,t:'25%+ of sales taken digitally',d:Math.round(m.digShare*100)+'% now. Take payments by QR or link.'},
   {ok:m.profit>0,t:'Positive profit in the last 30 days',d:R(m.profit)},
   {ok:S.trader.idVerified,t:'ID verified',d:'Do it in Grow → Make it official'},
   {ok:S.trader.bizAccount,t:'Business account opened',d:'Do it in Grow → Make it official'}
  ];

}

async function verifyPassCode(code){
  try{const [v,body,sig]=code.trim().split('.');if(v!=='PL1'||!body||!sig)return {ok:false,why:'Not a Paylo Passport code.'};
   const good=(await sign(body)).slice(0,24);
   if(good!==sig)return {ok:false,why:'Signature does not match. The Passport was changed after it was issued, so FNB would reject it.'};
   const p=JSON.parse(unb64u(body));if(Date.now()>p.exp)return {ok:false,why:'Passport has expired.'};
   return {ok:true,p};}catch(e){return {ok:false,why:'Could not read that code.'}}
}

function lock(){S.locked=true;S.pinBuf='';S.pinMode=S.pinHash?'enter':'create';S.pinMsg=S.pinHash?'Enter your PIN':'Create a 4-digit PIN for this phone';closeSheet();render();}
async function pinKey(k){
  if(Date.now()<S.lockUntil)return;
  if(k==='⌫')S.pinBuf=S.pinBuf.slice(0,-1);else if(S.pinBuf.length<4)S.pinBuf+=k;
  render();
  if(S.pinBuf.length<4)return;
  const pin=S.pinBuf;S.pinBuf='';
  if(!S.pinHash){
    if(S.pinMode==='create'){S.pinTemp=pin;S.pinMode='confirm';S.pinMsg='Enter it again to confirm';}
    else if(pin===S.pinTemp){S.pinSalt=crypto.getRandomValues(new Uint8Array(16));S.pinHash=await hashPin(pin,S.pinSalt);savePin();S.pinTemp='';S.locked=false;S.pinMode='enter';log('AUTH','PIN created · PBKDF2-SHA256 150,000 rounds · salt '+hex(S.pinSalt).slice(0,8)+'…');markDemo('pin');}
    else{S.pinMode='create';S.pinMsg='PINs did not match. Start again.';}
  }else{
    const h=await hashPin(pin,S.pinSalt);
    if(h===S.pinHash){S.locked=false;S.fails=0;log('AUTH','unlocked');}
    else{S.fails++;S.pinMsg='Wrong PIN ('+S.fails+' of 3)';log('AUTH','wrong PIN attempt '+S.fails);if(S.fails>=3){S.lockUntil=Date.now()+30000;S.fails=0;setTimeout(()=>{if(S.locked){S.pinMsg='Enter your PIN';render();}},30500);}}
  }
  render();renderLab();
}

   if(r.ok){el.className='res ok';el.innerHTML=`<b>Valid.</b> Score ${r.p.score} (${r.p.tier}), ${r.p.days} days traded, income ${r.p.rev}, ${r.p.dig}% digital, ${r.p.mar}% margin. Valid until ${new Date(r.p.exp).toLocaleDateString('en-ZA')}. No customer data inside.`;}
   else{el.className='res bad';el.textContent='Rejected. '+r.why;}},
 async labTamperPass(){const c=$('#labCode');if(!c.value.trim()){$('#labPass').textContent='Create a Passport in the app first.';return;}
   try{const [v,body,sig]=c.value.trim().split('.');const p=JSON.parse(unb64u(body));p.score=99;c.value=v+'.'+b64u(JSON.stringify(p))+'.'+sig;}catch(e){}
   L.labVerifyPass();}
};

}
